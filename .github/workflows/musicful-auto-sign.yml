name: Musicful Auto Sign

on:
  workflow_dispatch:
    inputs:
      account_index:
        description: "Musicful account index to sign in, or all"
        required: false
        default: "all"
  schedule:
    # Taiwan time windows: 05:00–06:00, 13:00–14:00, 21:00–22:00.
    # Cron fires on the hour; the job then sleeps a random 0–59 minutes so start lands in that hour.
    # All configured accounts (up to 33) then start with staggered 5–15s offsets and run concurrently.
    - cron: "0 21 * * *"
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: read

# Storage states are written back after a run, so never let two runs overlap and
# push stale cookies over fresher ones.
concurrency:
  group: musicful-auto-sign
  cancel-in-progress: false

jobs:
  signin:
    name: daily-signin
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MUSICFUL_MAX_ACCOUNTS: "33"
      MUSICFUL_SCHEDULE_MODE: "all"
      MUSICFUL_RESULT_DIR: artifacts
      MUSICFUL_SUMMARY_DIR: artifacts
      MUSICFUL_AUTO_SUMMARY: "1"
      MUSICFUL_REPORT_ALL_SLOTS: "1"
      MUSICFUL_ACCOUNT_FILTER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.account_index || 'all' }}
      MUSICFUL_SIGNIN_URL: ${{ vars.MUSICFUL_SIGNIN_URL || 'https://tw.musicful.ai/growth-center/' }}
      MUSICFUL_DELAY_MIN_MS: ${{ vars.MUSICFUL_DELAY_MIN_MS || '5000' }}
      MUSICFUL_DELAY_MAX_MS: ${{ vars.MUSICFUL_DELAY_MAX_MS || '15000' }}
      # Passive renewal. Needs MUSICFUL_SECRET_WRITE_TOKEN (PAT with Secrets: read and write);
      # without it the run only reports which states changed. Set the variable to 0 to turn off.
      MUSICFUL_REFRESH_SECRETS: ${{ vars.MUSICFUL_REFRESH_SECRETS || '1' }}
      MUSICFUL_SECRET_WRITE_TOKEN: ${{ secrets.MUSICFUL_SECRET_WRITE_TOKEN }}
      # Labels mirror previous matrix names (shown in Job Summary).
      MUSICFUL_ACCOUNT_LABELS_JSON: >-
        {"1":"goldshoot0720","2":"abuhg17","3":"fengtuprinfo","4":"feng33feng35feng3","5":"chbondg2","6":"huang1988pioneer","7":"chbondg_outloook","8":"gaokaolevel3iptopscorer_outlook","9":"huang1988pioneer_outloook","10":"fengtuta_tuta","11":"fengfence_fence","12":"samafengtu","13":"fengtusama","14":"fengwithting0831","15":"fengwithfeng1127","16":"fengwithtu1127","17":"akaonda333","18":"fbussinesseng","19":"engdictatorf","20":"flottojackpoteng","21":"tushenbyfengbro","22":"account_22","23":"account_23","24":"account_24","25":"account_25","26":"account_26","27":"account_27","28":"account_28","29":"account_29","30":"account_30","31":"account_31","32":"account_32","33":"account_33"}
      MUSICFUL_STORAGE_STATE_BASE64_1: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_1 }}
      MUSICFUL_STORAGE_STATE_BASE64_2: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_2 }}
      MUSICFUL_STORAGE_STATE_BASE64_3: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_3 }}
      MUSICFUL_STORAGE_STATE_BASE64_4: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_4 }}
      MUSICFUL_STORAGE_STATE_BASE64_5: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_5 }}
      MUSICFUL_STORAGE_STATE_BASE64_6: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_6 }}
      MUSICFUL_STORAGE_STATE_BASE64_7: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_7 }}
      MUSICFUL_STORAGE_STATE_BASE64_8: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_8 }}
      MUSICFUL_STORAGE_STATE_BASE64_9: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_9 }}
      MUSICFUL_STORAGE_STATE_BASE64_10: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_10 }}
      MUSICFUL_STORAGE_STATE_BASE64_11: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_11 }}
      MUSICFUL_STORAGE_STATE_BASE64_12: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_12 }}
      MUSICFUL_STORAGE_STATE_BASE64_13: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_13 }}
      MUSICFUL_STORAGE_STATE_BASE64_14: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_14 }}
      MUSICFUL_STORAGE_STATE_BASE64_15: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_15 }}
      MUSICFUL_STORAGE_STATE_BASE64_16: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_16 }}
      MUSICFUL_STORAGE_STATE_BASE64_17: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_17 }}
      MUSICFUL_STORAGE_STATE_BASE64_18: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_18 }}
      MUSICFUL_STORAGE_STATE_BASE64_19: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_19 }}
      MUSICFUL_STORAGE_STATE_BASE64_20: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_20 }}
      MUSICFUL_STORAGE_STATE_BASE64_21: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_21 }}
      MUSICFUL_STORAGE_STATE_BASE64_22: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_22 }}
      MUSICFUL_STORAGE_STATE_BASE64_23: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_23 }}
      MUSICFUL_STORAGE_STATE_BASE64_24: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_24 }}
      MUSICFUL_STORAGE_STATE_BASE64_25: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_25 }}
      MUSICFUL_STORAGE_STATE_BASE64_26: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_26 }}
      MUSICFUL_STORAGE_STATE_BASE64_27: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_27 }}
      MUSICFUL_STORAGE_STATE_BASE64_28: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_28 }}
      MUSICFUL_STORAGE_STATE_BASE64_29: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_29 }}
      MUSICFUL_STORAGE_STATE_BASE64_30: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_30 }}
      MUSICFUL_STORAGE_STATE_BASE64_31: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_31 }}
      MUSICFUL_STORAGE_STATE_BASE64_32: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_32 }}
      MUSICFUL_STORAGE_STATE_BASE64_33: ${{ secrets.MUSICFUL_STORAGE_STATE_BASE64_33 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Randomize scheduled start
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay_seconds=$((RANDOM % 3600))
          echo "Scheduled start delay: ${delay_seconds} seconds"
          sleep "$delay_seconds"

      - name: Run Musicful sign-ins
        run: npm run signin

      - name: Upload sign-in report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicful-signin-report
          path: |
            artifacts/signin-daily-summary.md
            artifacts/signin-daily-summary.json
            artifacts/signin-streaks.json
            artifacts/signin-result-*.json
          if-no-files-found: warn
          retention-days: 30
